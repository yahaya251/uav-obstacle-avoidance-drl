name: Navigation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install project and test navigation contracts
        run: |
          python -m pip install -e .
          python -m uav_nav.checks --output runs/core-checks
          bash -n simulation/run.sh
      - name: Run and verify the PPO smoke benchmark
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[benchmark]'
          python -m uav_nav.benchmark run --profile smoke --output runs/smoke
          python -m uav_nav.benchmark verify runs/smoke

  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.10'
      - name: Run the PowerShell planar workflow
        shell: pwsh
        run: |
          $env:UAV_PYTHON = (Get-Command python -CommandType Application).Source
          .\setup\planar.ps1 setup
          .\setup\planar.ps1 core
          .\setup\planar.ps1 smoke
      - name: Test Isaac Lab observation and action math on CPU
        shell: pwsh
        run: |
          .\isaac_lab\setup.ps1 help
          $env:PYTHONPATH = Join-Path (Get-Location) 'isaac_lab'
          .\.venv-planar\Scripts\python.exe -m unittest discover -s isaac_lab/tests -v
